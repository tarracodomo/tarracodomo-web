name: Añadir tarjeta TTGO
on:
  push:
    branches: [main]
    paths: ['.github/workflows/anadir-ttgo.yml']
permissions:
  contents: write
concurrency:
  group: rutas-limpias
  cancel-in-progress: false
jobs:
  tarjeta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Añadir TTGO sin sustituir otros equipos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          from pathlib import Path
          p = Path('tecnologia.html')
          text = p.read_text(encoding='utf-8')
          assert Path('img/propias/ttgo.webp').is_file(), 'Falta la foto TTGO'
          start = text.index('<section id="galeria-propia">')
          end = text.index('</section>', start)
          gallery = text[start:end]
          if 'src="/img/propias/ttgo.webp"' not in gallery:
              anchor = '<div class="card"><a href="/meshtastic"><img alt="Placa LILYGO T-Beam con GPS para Meshtastic"'
              assert gallery.count(anchor) == 1, 'No se encuentra una unica tarjeta T-Beam'
              card = '<div class="card"><a href="/meshtastic"><img alt="TTGO" decoding="async" loading="lazy" src="/img/propias/ttgo.webp" style="display:block;width:100%;height:180px;object-fit:contain;border-radius:10px;margin-bottom:14px"/></a><p>TTGO</p></div>'
              gallery = gallery.replace(anchor, card + anchor, 1)
              text = text[:start] + gallery + text[end:]
          assert gallery.count('src="/img/propias/ttgo.webp"') == 1
          p.write_text(text, encoding='utf-8')
          Path('tecnologia/index.html').write_text(text, encoding='utf-8')
          PY
            git add tecnologia.html tecnologia/index.html
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Añade TTGO a Nuestros componentes conservando T-Beam'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((intento * 3))
          done
          exit 1
