name: Analitica

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - ".github/workflows/analytics.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: analitica
  cancel-in-progress: true

jobs:
  snippet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Insertar snippet y regenerar carpetas
        run: |
          python3 - <<'PY'
          import pathlib, shutil
          SNIPPET = "<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{\"token\": \"fc4a22d99a2740a48d0bb8af129d22fc\"}'></script><!-- End Cloudflare Web Analytics -->"
          changed = []
          for f in sorted(pathlib.Path('.').glob('*.html')):
              t = f.read_text(encoding='utf-8')
              if 'cloudflareinsights' not in t:
                  if '</body>' in t:
                      t = t.replace('</body>', SNIPPET + '\n</body>', 1)
                  else:
                      t = t + SNIPPET + '\n'
                  f.write_text(t, encoding='utf-8')
                  changed.append(f.name)
          print('Con snippet:', len(changed))
          for f in sorted(pathlib.Path('.').glob('*.html')):
              name = f.stem
              if name in ('index', '404'):
                  continue
              d = pathlib.Path(name)
              d.mkdir(exist_ok=True)
              shutil.copyfile(f, d / 'index.html')
          print('Carpetas regeneradas')
          PY

      - name: Guardar cambios
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Analitica: snippet y carpetas limpias al dia"
          git push
