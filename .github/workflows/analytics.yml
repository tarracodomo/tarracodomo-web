name: Analitica

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - ".github/workflows/analytics.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rutas-limpias
  cancel-in-progress: false

jobs:
  snippet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sincronizar analitica y carpetas con reintentos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import pathlib, shutil
          snippet = '''<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "fc4a22d99a2740a48d0bb8af129d22fc"}'></script><!-- End Cloudflare Web Analytics -->'''
          for f in sorted(pathlib.Path('.').glob('*.html')):
              text = f.read_text(encoding='utf-8')
              if 'cloudflareinsights' not in text:
                  text = text.replace('</body>', snippet + '\n</body>', 1) if '</body>' in text else text + snippet + '\n'
                  f.write_text(text, encoding='utf-8')
              if f.stem not in ('index', '404'):
                  directory = pathlib.Path(f.stem)
                  directory.mkdir(exist_ok=True)
                  shutil.copyfile(f, directory / 'index.html')
          PY
            git add -- '*.html' '*/index.html'
            if git diff --cached --quiet; then
              echo "Analitica y carpetas actualizadas"
              exit 0
            fi
            git commit -m "Analitica: sincroniza snippet y rutas"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((intento * 3))
          done
          echo "::error::Publicacion rechazada tras cinco intentos"
          exit 1
