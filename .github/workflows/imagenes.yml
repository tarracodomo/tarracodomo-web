name: Imagenes Commons

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  optimizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Pillow
        run: pip install --quiet pillow
      - name: Descargar y convertir
        run: python tools/imagenes.py
      - name: Guardar cambios
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add img ATTRIBUCION.md
          git commit -m "Imagenes: descarga de Commons y conversion a WebP"
          git push
