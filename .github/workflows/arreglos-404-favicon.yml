name: Arreglos 404 y favicon
on:
  push:
    branches: [main]
    paths: ['.github/workflows/arreglos-404-favicon.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Crear 404 y favicon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          icon = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0f172a"/><path d="M32 11 11 28v25h15V40h12v13h15V28z" fill="#38bdf8"/></svg>'
          Path('favicon.svg').write_text(icon + '\n', encoding='utf-8')
          nav = '<nav class="site-nav" aria-label="Navegacion principal"><div class="wrap"><details class="site-menu"><summary aria-label="Abrir o cerrar menu"><span aria-hidden="true">☰</span></summary><div class="site-links"><a href="index.html">Inicio</a><a href="nosotros.html">Nosotros</a><a href="servicios.html">Servicios</a><a href="tecnologia.html">Tecnología</a><a href="programacion.html">Programación</a><a href="proyectos.html">Proyectos</a><a href="meshtastic.html">Meshtastic</a><a href="documentacion.html">Documentación</a><a href="contacto.html">Contacto</a></div></details><a class="brandlink" href="index.html"><b>Tarraco Domo</b></a><a class="site-email" href="mailto:info@tarracodomo.com">info@tarracodomo.com</a></div></nav>'
          page = ['<!DOCTYPE html>', '<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">', '<title>Página no encontrada | Tarraco Domo</title>', '<meta name="robots" content="noindex">', '<link rel="stylesheet" href="styles.css">', '<link rel="stylesheet" href="cabecera.css">', '</head><body>', nav, '<main class="wrap">', '<h1 class="pt">Esta página no existe</h1>', '<p class="sub">Puede que el enlace esté mal escrito o que la página se haya movido. Desde aquí puedes volver a lo importante.</p>', '<p style="text-align:center"><a class="btn" href="index.html">Ir al inicio</a><a class="btn alt" href="tecnologia.html">Ver tecnología</a><a class="btn alt" href="contacto.html">Contactar</a></p>', '<p class="note" style="text-align:center">Si llegaste desde un enlace nuestro, cuéntanoslo en <a href="mailto:info@tarracodomo.com">info@tarracodomo.com</a> y lo corregimos.</p>', '</main>', '<footer>© 2026 Tarraco Domo · <a href="aviso-legal.html">Aviso legal</a> · <a href="privacidad.html">Política de privacidad</a> · <a href="cookies.html">Cookies</a></footer>', '</body></html>']
          Path('404.html').write_text('\n'.join(page) + '\n', encoding='utf-8')
          tag = '<link rel="icon" href="favicon.svg" type="image/svg+xml">\n</head>'
          tocados = 0
          for f in sorted(Path('.').glob('*.html')):
              t = f.read_bytes().decode('utf-8')
              if 'rel="icon"' in t or '</head>' not in t:
                  continue
              f.write_bytes(t.replace('</head>', tag, 1).encode('utf-8'))
              tocados += 1
          print('paginas con favicon:', tocados)
          PY
          git add -- 404.html favicon.svg '*.html'
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Web: pagina 404 propia y favicon en todas las paginas"
          git push origin HEAD:main
