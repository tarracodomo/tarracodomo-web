name: Activar tema navideno

on:
  schedule:
    - cron: '0 6 10 12 *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Activar Navidad solo en 2026
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(date -u +%Y)" != "2026" ]; then
            echo "No es 2026, no se activa"
            exit 0
          fi
          if grep -q 'navidad.css' styles.css; then
            echo "La Navidad ya esta activa"
            exit 0
          fi
          sed -i '1i @import url("navidad.css");' styles.css
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add styles.css
          git commit -m "Activa el tema navideno (programado 10 de diciembre)"
          git push
