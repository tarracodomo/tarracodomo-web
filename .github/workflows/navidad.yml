name: Activar tema navideno

on:
  schedule:
    - cron: '0 6 1 12 *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Activar Navidad
        run: |
          if grep -q 'navidad.css' styles.css; then
            echo "La Navidad ya esta activa"
            exit 0
          fi
          sed -i '1i @import url("navidad.css");' styles.css
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add styles.css
          git commit -m "Activa el tema navideno (programado 1 de diciembre)"
          git push
