name: Convertir fotos - prueba segura
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  convertir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python tools/convertir_prueba.py
      - uses: actions/upload-artifact@v4
        with:
          name: fotos-webp-prueba
          path: conversion-prueba/
          if-no-files-found: error
