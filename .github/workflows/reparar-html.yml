name: Reparar etiquetas img del banner
on:
  push:
    branches: [main]
    paths: ['.github/workflows/reparar-html.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  reparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Cerrar img y restaurar og:image
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          changed = []
          for f in sorted(Path('.').glob('*.html')):
              t0 = f.read_text(encoding='utf-8')
              t = re.sub(r'(<img\b[^<>]*)(</picture>)', r'\1>\2', t0)
              t = t.replace('content="https://tarracodomo.com/tarraco-domo.webp"', 'content="https://tarracodomo.com/image-3.png"')
              if t != t0:
                  f.write_text(t, encoding='utf-8')
                  changed.append(f.name)

          bad = []
          for f in sorted(Path('.').glob('*.html')):
              t = f.read_text(encoding='utf-8')
              for m in re.finditer(r'<img\b', t):
                  seg = t[m.start():m.start() + 600]
                  if '>' not in seg.split('<')[0]:
                      bad.append(f.name + ': img sin cerrar')
              if t.count('<picture>') != t.count('</picture>'):
                  bad.append(f.name + ': picture desbalanceado')

          lines = [
              'INFORME - reparacion de etiquetas',
              '',
              'ESTADO: ' + ('OK' if not bad else 'FALLA'),
              'PAGINAS REPARADAS: ' + str(len(changed)),
            ] + ['  - ' + c for c in changed] + ['', 'ERRORES:'] + (['  - ' + b for b in sorted(set(bad))] if bad else ['  ninguno'])
          Path('.github').mkdir(exist_ok=True)
          Path('.github/informe-reparacion.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          Path('.github/.ok').write_text('1' if not bad else '0', encoding='utf-8')
          print('\n'.join(lines))
          import sys
          if bad:
              sys.exit(1)
          PY
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Cierra las etiquetas img del banner y devuelve og:image al PNG"
          git push
