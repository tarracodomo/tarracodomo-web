name: Apartado enjambres de drones
on:
  push:
    branches: [main]
    paths: ['.github/workflows/enjambres-drones.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Anadir apartado de enjambres de drones
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tecnologia.html')
          original = p.read_bytes().decode('utf-8')
          meta_old = 'content="Tecnología de Tarraco Domo: sensores DHT, PIR, ESP32, ESP8266, Arduino, Raspberry Pi, Orange Pi, Banana Pi, relés y servomotores para domótica en Tarragona."'
          meta_new = 'content="Tecnología de Tarraco Domo: sensores DHT, PIR y ultrasónicos, ESP32, ESP8266, Arduino, Raspberry Pi, Orange Pi, Banana Pi, relés, servomotores, enjambres de drones para vigilancia y rutas GPS en Tarragona."'
          result = original
          if meta_old in result:
              result = result.replace(meta_old, meta_new, 1)
          anchor = '<p class="note" style="text-align:center;margin-top:16px">Las ilustraciones'
          if result.count(anchor) != 1:
              raise RuntimeError('Ancla no encontrada')
          if 'id="drones"' not in result:
              parts = []
              parts.append('<h2 id="drones">Enjambres de drones para vigilancia</h2>')
              parts.append('<p class="sub">Varios drones coordinados como un solo sistema: cubren más superficie, se relevan entre sí y comparten lo que cada uno ve. Vuelan rutas definidas por coordenadas GPS y pueden mantenerse activos 24/7 sin que nadie pilote dron a dron.</p>')
              parts.append('<div class="grid">')
              parts.append('<div class="card part"><div class="pic"><svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"><path d="M55 55L100 38L145 60M55 95L100 38M100 38L145 100M55 95L145 100" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 4" fill="none" opacity=".55"/><path d="M43 55h24M55 43v24M92 38h16M100 30v16M135 60h20M145 50v20" stroke="#cbd5e1" stroke-width="3"/><circle cx="43" cy="43" r="5" fill="#fbbf24"/><circle cx="67" cy="43" r="5" fill="#fbbf24"/><circle cx="43" cy="67" r="5" fill="#fbbf24"/><circle cx="67" cy="67" r="5" fill="#fbbf24"/><rect x="49" y="49" width="12" height="12" rx="3" fill="#0f766e"/><circle cx="92" cy="30" r="4" fill="#fbbf24"/><circle cx="108" cy="30" r="4" fill="#fbbf24"/><circle cx="92" cy="46" r="4" fill="#fbbf24"/><circle cx="108" cy="46" r="4" fill="#fbbf24"/><rect x="96" y="34" width="8" height="8" rx="2" fill="#0f766e"/><circle cx="135" cy="50" r="5" fill="#fbbf24"/><circle cx="155" cy="50" r="5" fill="#fbbf24"/><circle cx="135" cy="70" r="5" fill="#fbbf24"/><circle cx="155" cy="70" r="5" fill="#fbbf24"/><rect x="140" y="55" width="10" height="10" rx="2" fill="#0f766e"/></svg></div><h3>Vuelo coordinado</h3><p>Un piloto maneja varias aeronaves a la vez y el conjunto vuela como un solo equipo: se reparten el área, mantienen distancias y comparten datos de posición y de cámara.</p></div>')
              parts.append('<div class="card part"><div class="pic"><svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"><rect x="10" y="12" width="180" height="106" rx="6" fill="#0b1220" stroke="#334155"/><path d="M14 65h172M70 14v102M130 14v102" stroke="#1e293b" stroke-width="1.5"/><path d="M40 100L62 62L100 80L140 42L164 64" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5" fill="none"/><circle cx="40" cy="100" r="5" fill="#38bdf8"/><circle cx="62" cy="62" r="5" fill="#38bdf8"/><circle cx="100" cy="80" r="5" fill="#38bdf8"/><circle cx="140" cy="42" r="5" fill="#38bdf8"/><circle cx="140" cy="42" r="12" fill="none" stroke="#38bdf8" opacity=".45"/><path d="M158 92h18M167 83v18" stroke="#94a3b8" stroke-width="2"/><circle cx="167" cy="101" r="3" fill="#94a3b8"/></svg></div><h3>Rutas por coordenadas GPS</h3><p>La ronda se define con puntos y coordenadas: el dron recorre el perímetro, repite la vuelta a la hora fijada y regresa solo a la base. Cambiar la ruta es cuestión de editar la lista de puntos.</p></div>')
              parts.append('<div class="card part"><div class="pic"><svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"><circle cx="74" cy="65" r="36" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/><circle cx="74" cy="65" r="3" fill="#38bdf8"/><path d="M74 41v24l16 10" stroke="#e2e8f0" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M30 30l-8-8M118 30l8-8" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/><text x="116" y="72" font-size="22" fill="#fbbf24" font-family="sans-serif" font-weight="700">24/7</text><path d="M118 86h54" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/><path d="M126 100h38" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/></svg></div><h3>Cobertura 24/7 y relevo</h3><p>Cuando un dron baja a cambiar batería, otro ocupa su puesto y la ronda no se interrumpe. Así la vigilancia puede seguir de día y de noche sin una persona pendiente de cada aeronave.</p></div>')
              parts.append('<div class="card part"><div class="pic"><svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"><path d="M100 12l52 19v33c0 29-24 48-52 57-28-9-52-28-52-57V31z" fill="#1e40af"/><path d="M78 65l16 16 30-32" stroke="#e2e8f0" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h3>Normativa y seguridad</h3><p>Un enjambre no es un grupo de vuelos sueltos: se autoriza como operación conjunta. En la UE se aplica el Reglamento (UE) 2019/947 y en España el Real Decreto 517/2024, con AESA como autoridad competente; volar fuera del alcance de la vista exige autorización.</p></div>')
              parts.append('</div>')
              parts.append('<div class="card" style="max-width:820px;margin:24px auto 0"><h3>Vídeos y referencias</h3><ul class="list"><li><a href="https://youtube.com/shorts/c7VA0kQD1mg" target="_blank" rel="noopener noreferrer">Enjambre de drones en tareas de vigilancia (YouTube)</a></li></ul><p class="note" style="margin:12px 0 0">Lista abierta: iremos añadiendo más vídeos y referencias.</p></div>')
              section = '\n'.join(parts) + '\n'
              result = result.replace(anchor, section + anchor, 1)
          p.write_bytes(result.encode('utf-8'))
          print('ok')
          PY
          git add -- tecnologia.html
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Tecnologia: enjambres de drones con rutas GPS y cobertura 24/7"
          git push origin HEAD:main
