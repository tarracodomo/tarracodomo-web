name: Apartado enjambres de drones
on:
  push:
    branches: [main]
    paths: ['.github/workflows/enjambres-drones.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Anadir apartado de enjambres de drones
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tecnologia.html')
          original = p.read_bytes().decode('utf-8')
          if 'id="drones"' in original:
              raise RuntimeError('El apartado ya existe')
          old_meta = 'content="Tecnología de Tarraco Domo: sensores DHT, PIR, ESP32, ESP8266, Arduino, Raspberry Pi, Orange Pi, Banana Pi, relés y servomotores para domótica en Tarragona."'
          new_meta = 'content="Tecnología de Tarraco Domo: sensores DHT, PIR y ultrasónicos, ESP32, ESP8266, Arduino, Raspberry Pi, Orange Pi, Banana Pi, relés, servomotores y enjambres de drones para vigilancia en Tarragona."'
          if original.count(old_meta) != 1:
              raise RuntimeError('Meta descripcion inesperada')
          result = original.replace(old_meta, new_meta, 1)
          anchor = '<p class="note" style="text-align:center;margin-top:16px">Las ilustraciones'
          if result.count(anchor) != 1:
              raise RuntimeError('Ancla no encontrada')
          section = '''<h2 id="drones">Enjambres de drones para vigilancia</h2>
<p class="sub">Varios drones coordinados como un solo sistema: cubren más superficie, se relevan entre sí y comparten lo que cada uno ve. Es una línea que seguimos de cerca y que integramos en proyectos de vigilancia cuando aporta una ventaja real.</p>
<div class="grid">
<div class="card part"><div class="pic"><svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"><path d="M55 55L100 38L145 60M55 95L100 38M100 38L145 100M55 95L145 100" stroke="#38bdf8" stroke-width="2" stroke-dasharray="5 4" fill="none" opacity=".55"/><path d="M43 55h24M55 43v24M92 38h16M100 30v16M135 60h20M145 50v20" stroke="#cbd5e1" stroke-width="3"/><circle cx="43" cy="43" r="5" fill="#fbbf24"/><circle cx="67" cy="43" r="5" fill="#fbbf24"/><circle cx="43" cy="67" r="5" fill="#fbbf24"/><circle cx="67" cy="67" r="5" fill="#fbbf24"/><rect x="49" y="49" width="12" height="12" rx="3" fill="#0f766e"/><circle cx="92" cy="30" r="4" fill="#fbbf24"/><circle cx="108" cy="30" r="4" fill="#fbbf24"/><circle cx="92" cy="46" r="4" fill="#fbbf24"/><circle cx="108" cy="46" r="4" fill="#fbbf24"/><rect x="96" y="34" width="8" height="8" rx="2" fill="#0f766e"/><circle cx="135" cy="50" r="5" fill="#fbbf24"/><circle cx="155" cy="50" r="5" fill="#fbbf24"/><circle cx="135" cy="70" r="5" fill="#fbbf24"/><circle cx="155" cy="70" r="5" fill="#fbbf24"/><rect x="140" y="55" width="10" height="10" rx="2" fill="#0f766e"/></svg></div><h3>Vuelo coordinado</h3><p>Un piloto maneja varias aeronaves a la vez y el conjunto vuela como un solo equipo: se reparten el área, mantienen distancias y comparten datos de posición y de cámara.</p></div>
<div class="card part"><div class="pic"><svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"><rect x="12" y="12" width="176" height="106" rx="6" fill="#0b1220" stroke="#334155"/><path d="M12 65h176M70 12v106M130 12v106" stroke="#1e293b" stroke-width="2"/><path d="M40 30l20 60H20z" fill="#38bdf8" opacity=".22"/><path d="M100 22l24 62H76z" fill="#38bdf8" opacity=".3"/><path d="M162 30l20 60h-40z" fill="#38bdf8" opacity=".22"/><path d="M30 20h140" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 5"/><circle cx="30" cy="20" r="4" fill="#fbbf24"/><circle cx="100" cy="20" r="4" fill="#fbbf24"/><circle cx="170" cy="20" r="4" fill="#fbbf24"/></svg></div><h3>Cobertura y relevo</h3><p>Cada dron vigila una zona y, cuando uno baja a cambiar batería, otro ocupa su puesto. Así se mantiene la observación continua en perímetros largos, naves o fincas grandes.</p></div>
<div class="card part"><div class="pic"><svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"><path d="M100 12l52 19v33c0 29-24 48-52 57-28-9-52-28-52-57V31z" fill="#1e40af"/><path d="M78 65l16 16 30-32" stroke="#e2e8f0" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h3>Normativa y seguridad</h3><p>Un enjambre no es un grupo de vuelos sueltos: se autoriza como operación conjunta. En la UE se aplica el Reglamento (UE) 2019/947 y en España el Real Decreto 517/2024, con AESA como autoridad competente.</p></div>
</div>
<div class="card" style="max-width:820px;margin:24px auto 0"><h3>Vídeos y referencias</h3><ul class="list"><li><a href="https://youtube.com/shorts/c7VA0kQD1mg" target="_blank" rel="noopener noreferrer">Enjambre de drones en tareas de vigilancia (YouTube)</a></li></ul><p class="note" style="margin:12px 0 0">Lista abierta: iremos añadiendo más vídeos y referencias.</p></div>
'''
          result = result.replace(anchor, section + anchor, 1)
          p.write_bytes(result.encode('utf-8'))
          print('ok', len(result))
          PY
          git add -- tecnologia.html
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Tecnologia: apartado de enjambres de drones para vigilancia"
          git push origin HEAD:main
