name: Optimizar imagenes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Pillow
        run: python -m pip install Pillow==11.3.0

      - name: Convertir a WebP
        run: python tools/optimizar_imagenes.py

      - name: Commit y push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img
          if git diff --cached --quiet; then
            echo "No hay cambios que commitear"
          else
            git commit -m "Optimizar imagenes: versiones WebP ligeras [skip ci]"
            git push
          fi
