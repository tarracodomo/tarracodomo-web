name: Corregir fotos y Yellow Cheap Display
on:
  push:
    branches: [main]
    paths:
      - tools/corregir_fotos.py
      - .github/workflows/corregir-fotos.yml
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 beautifulsoup4==4.13.4
      - run: python tools/corregir_fotos.py
      - name: Guardar correcciones
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add '*.html' '*/index.html' tools/publicar_propias.py tools/fichas.py sitemap.xml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Corregir fotos: pantallas, Yellow Cheap Display y Wemos'
          git push
