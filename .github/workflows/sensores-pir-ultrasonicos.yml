name: Sensores PIR y ultrasonicos
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sensores-pir-ultrasonicos.yml']
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: rutas-limpias
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Actualizar sensores y sincronizar pagina
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          for intento in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          from pathlib import Path
          p = Path('tecnologia.html')
          text = p.read_text(encoding='utf-8')
          old = '<h3>Sensores de movimiento PIR</h3><p>Detectan presencia por infrarrojos. Sirven para alarmas, luces automáticas y para activar cámaras solo cuando hace falta.</p>'
          new = '<h3>Sensores PIR y ultrasónicos</h3><p>Los sensores PIR detectan movimiento por cambios en la radiación infrarroja. Los ultrasónicos, como el HC-SR04, miden distancia mediante el eco de pulsos de sonido. Se eligen según el uso: avisos de movimiento, luces automáticas, proximidad o medición de nivel.</p>'
          if text.count(old) == 1 and text.count(new) == 0:
              text = text.replace(old, new, 1)
          elif text.count(new) == 1 and text.count(old) == 0:
              print('El cambio ya estaba aplicado')
          else:
              raise RuntimeError('Contenido inesperado: no se modifica la pagina')
          p.write_text(text, encoding='utf-8')
          target = Path('tecnologia/index.html')
          target.parent.mkdir(exist_ok=True)
          target.write_text(text, encoding='utf-8')
          assert p.read_bytes() == target.read_bytes()
          PY
            git add tecnologia.html tecnologia/index.html
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Sincroniza sensores PIR y ultrasonicos'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((intento * 3))
          done
          echo '::error::No se pudo publicar tras cinco intentos'
          exit 1
