name: Desactivar tema navideno

on:
  schedule:
    - cron: '0 6 8 1 *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  desactivar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Desactivar Navidad
        run: |
          if ! grep -q 'navidad.css' styles.css; then
            echo "El tema navideno ya esta desactivado"
            exit 0
          fi
          sed -i '/@import url("navidad\.css");/d' styles.css
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add styles.css
          git commit -m "Desactiva el tema navideno (programado 8 de enero)"
          git push
