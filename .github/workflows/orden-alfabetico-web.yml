name: Orden alfabetico web
on:
  push:
    branches: [main]
    paths: ['.github/workflows/orden-alfabetico-web.yml']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ordenar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ordenar bloques conservando su HTML
        run: |
          python3 - <<'PY'
          import re, subprocess, unicodedata, html
          from pathlib import Path
          from html.parser import HTMLParser
          def key(value):
              value = html.unescape(re.sub(r'<[^>]*>', '', value))
              value = ''.join(c for c in unicodedata.normalize('NFD', value.casefold()) if not unicodedata.combining(c) or c == '\u0303')
              value = unicodedata.normalize('NFC', value)
              value = re.sub(r'^[^\w]+', '', value).strip()
              return value.replace('ñ', 'n~')
          class Parser(HTMLParser):
              def __init__(self, text):
                  super().__init__(convert_charrefs=False)
                  self.text = text
                  self.lines = [0] + [m.end() for m in re.finditer('\n', text)]
                  self.root = {'children': [], 'tag': '', 'attrs': {}, 'parent': None}
                  self.stack = [self.root]
                  self.nodes = [self.root]
                  self.feed(text)
              def offset(self):
                  line, col = self.getpos()
                  return self.lines[line-1] + col
              def handle_starttag(self, tag, attrs):
                  start = self.offset()
                  node = {'tag': tag, 'attrs': dict(attrs), 'start': start, 'end': start + len(self.get_starttag_text()), 'children': [], 'parent': self.stack[-1]}
                  self.stack[-1]['children'].append(node)
                  self.nodes.append(node)
                  if tag not in {'area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'}:
                      self.stack.append(node)
              def handle_startendtag(self, tag, attrs):
                  before = len(self.stack)
                  self.handle_starttag(tag, attrs)
                  if len(self.stack) > before:
                      self.stack.pop()
              def handle_endtag(self, tag):
                  if len(self.stack) == 1 or self.stack[-1]['tag'] != tag:
                      raise RuntimeError('HTML no balanceado: ' + tag)
                  self.stack.pop()['end'] = self.text.index('>', self.offset()) + 1
          pending = []
          for name in subprocess.check_output(['git','ls-files','-z'], text=True).split('\0'):
              p = Path(name)
              if not name.endswith('.html') or p.is_symlink():
                  continue
              text = p.read_bytes().decode('utf-8')
              parser = Parser(text)
              if len(parser.stack) != 1:
                  raise RuntimeError('Etiquetas sin cerrar: ' + name)
              edits = []
              for parent in parser.nodes:
                  children = parent['children']
                  cards = [n for n in children if 'card' in n['attrs'].get('class','').split()]
                  ancestor = parent
                  in_nav = False
                  while ancestor:
                      in_nav = in_nav or ancestor['tag'] == 'nav'
                      ancestor = ancestor['parent']
                  links = [n for n in children if n['tag'] == 'a' and 'brandlink' not in n['attrs'].get('class','').split()]
                  group = cards if len(cards) > 1 else links if in_nav and len(links) > 1 else []
                  if not group:
                      continue
                  if len(group) != len(children):
                      raise RuntimeError('Grupo mixto; revisar antes de ordenar: ' + name)
                  for a,b in zip(group, group[1:]):
                      if text[a['end']:b['start']].strip():
                          raise RuntimeError('Contenido entre tarjetas o enlaces: ' + name)
                  def label(n):
                      block = text[n['start']:n['end']]
                      if group is cards:
                          title = re.search(r'<h[23]\b[^>]*>(.*?)</h[23]>', block, re.S)
                          if not title:
                              raise RuntimeError('Tarjeta sin titulo: ' + name)
                          return key(title[1])
                      return key(block)
                  ordered = sorted(group, key=label)
                  if ordered != group:
                      edits.append((group[0]['start'], group[-1]['end'], '\n'.join(text[n['start']:n['end']] for n in ordered)))
              edits.sort()
              if any(a[1] > b[0] for a,b in zip(edits, edits[1:])):
                  raise RuntimeError('Grupos superpuestos: ' + name)
              for start,end,block in reversed(edits):
                  text = text[:start] + block + text[end:]
              if edits:
                  pending.append((p, text.encode('utf-8')))
          for p,data in pending:
              p.write_bytes(data)
              subprocess.run(['git','add','--',str(p)], check=True)
              print('Ordenado:',p)
          PY
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git commit -m "Ordena alfabeticamente menus y grupos de tarjetas"
          git push origin HEAD:main
