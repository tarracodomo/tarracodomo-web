name: Publicar fotos propias
on:
  push:
    branches: [main]
    paths:
      - tools/publicar_propias.py
      - .github/workflows/publicar-propias.yml
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: publicar-propias
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0 beautifulsoup4==4.13.4
      - run: python tools/publicar_propias.py
      - name: Guardar fotos y HTML
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add img/propias '*.html' '*/index.html' FOTOS-PROPIAS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fotos propias optimizadas en fichas, tarjetas y galeria'
          git push
